name: Update Resume PDF from Resume Repo

on:
  repository_dispatch:
    types: [resume-updated]

# Only let the newest run proceed so rapid pushes to the Resume repo don't race each other.
concurrency:
  group: resume-pdf-update
  cancel-in-progress: true

jobs:
  build-and-copy-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio repo
        uses: actions/checkout@v4
        with:
          path: portfolio

      - name: Checkout resume repo
        uses: actions/checkout@v4
        with:
          repository: ParthGaneriwala/Resume
          path: resume
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install TeX Live (LaTeX)
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra

      - name: Compile both CVs to PDF
        run: |
          cd resume
          xelatex -interaction=nonstopmode resume_cv.tex
          xelatex -interaction=nonstopmode resume_cv_academia.tex
          cp resume_cv.pdf ../portfolio/public/parth_resume.pdf
          cp resume_cv_academia.pdf ../portfolio/public/parth_cv_academic.pdf

      - name: Commit and push PDF to portfolio repo
        run: |
          cd portfolio
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/parth_resume.pdf public/parth_cv_academic.pdf
          if git diff --cached --quiet; then
            echo "No resume changes to commit"
            exit 0
          fi
          git commit -m "Update resume PDFs from Resume repo"
          git pull --rebase https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/ParthGaneriwala/portfolio.git master
          git push https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/ParthGaneriwala/portfolio.git HEAD:master
